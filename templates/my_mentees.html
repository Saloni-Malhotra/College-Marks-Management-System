<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Mentees</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef3fc;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      color: #1e3a8a;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      background: #f0f4ff;
      margin: 5px 0;
      padding: 10px;
      border-radius: 8px;
    }
    .back-button {
      padding: 10px 15px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      text-align: center;
      display: block;
      margin: 20px 0;
      text-decoration: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>My Mentees</h1>

  <ul>
    {% for mentee in mentees %}
      <li>
        <strong>USN:</strong> {{ mentee.usn }}<br>
        <strong>Name:</strong> {{ mentee.name }}<br>
        <strong>Phone:</strong> {{ mentee.phone }}
      </li>
    {% endfor %}
  </ul>

  <a href="/mentor-dashboard" class="back-button">Back to Dashboard</a>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mentor Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef3fc;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .header, .info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .profile {
      background: #f0f4ff;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      width: 200px;
    }
    .profile img {
      width: 150px;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 20px;
    }
    .buttons button {
      flex: 1 1 200px;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .header h1 {
      color: #1e3a8a;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>College Marksheet Portal</h1>
    <button onclick="window.location.href='index.html'">Log out</button>
  </div>

  <div class="info">
    <div class="profile">
      <img src="static\profile.png" alt="Profile">
      <p><strong>Name:</strong> <span id="mentor-name">Loading...</span></p>
      <p><strong>Faculty ID:</strong> <span id="faculty-id">Loading...</span></p>
    </div>

    <div class="buttons">
      <button onclick="window.location.href='/my-mentees'">My Mentees</button>
      <button onclick="window.location.href='/enter-mentee-marks'">Enter Mentee Marks</button>
      <button>My Data</button>
      <button>Raise Ticket</button>
    </div>
  </div>
</div>

<script>
  window.onload = function() {
    fetch('/get-mentor-data')
      .then(response => {
        if (!response.ok) {
          return response.json().then(err => { throw new Error(err.error || 'Unknown error'); });
        }
        return response.json();
      })
      .then(data => {
        if (data.error) {
          alert("Error loading mentor data: " + data.error); // Inform the user if there's an error
        } else {
          // Populate the mentor's name and faculty ID
          document.getElementById('mentor-name').innerText = data.name || "N/A";
          document.getElementById('faculty-id').innerText = data.faculty_id || "N/A";
        }
      })
      .catch(error => {
        console.error('Error fetching mentor data:', error);
        alert('Error fetching mentor data: ' + error.message);  // Show error message to user
      });
  }
</script>

</body>
</html>

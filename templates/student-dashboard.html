<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Dashboard</title>
  <style>
    body { font-family: Arial; background: #eef3fc; margin:0; padding:0; }
    .container { max-width:900px; margin:20px auto; padding:20px; background:white; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
    .header, .info { display:flex; justify-content:space-between; align-items:center; }
    .profile { background:#f0f4ff; padding:15px; border-radius:8px; text-align:center; width:200px; }
    .profile img { width:150px; }
    .buttons { display:flex; flex-wrap:wrap; gap:15px; margin-top:20px; }
    .buttons button { flex:1 1 200px; padding:12px; background:#2563eb; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer; }
    .header h1 { color:#1e3a8a; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>College Marksheet Portal</h1>
    <button onclick="window.location.href='index.html'">Log out</button>
  </div>

  <div class="info">
    <div class="profile">
      <img src="static\profile.png" alt="Profile">
      <p><strong>Name:</strong> <span id="student-name">Loading...</span></p>
      <p><strong>USN:</strong> <span id="student-usn">Loading...</span></p>
    </div>

    <div class="buttons">
      <button onclick="window.location.href='/generate-marksheet'">Generate Marksheet</button>
      <button onclick="window.location.href='/view-marksheet'">View Semester Marksheet</button>
      <button>Contact Mentor</button>
      <button>About Me</button>
    </div>
  </div>
</div>

<script>
  // Fetch and display student data just after page load
  fetch('/get-student-data')
    .then(r => r.json())
    .then(data => {
      if (data.name && data.usn) {
        document.getElementById('student-name').innerText = data.name;
        document.getElementById('student-usn').innerText = data.usn;
      } else {
        document.getElementById('student-name').innerText = 'Not found';
        document.getElementById('student-usn').innerText = 'Not found';
      }
    })
    .catch(() => {
      document.getElementById('student-name').innerText = 'Error';
      document.getElementById('student-usn').innerText = 'Error';
    });
</script>

</body>
</html>
